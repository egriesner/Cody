  <text x="64" y="176" class="panel-title">Section 1: Open-World Survival Loop</text>

  <rect x="64" y="196" width="250" height="130" class="chip"/>
  <text x="76" y="220" class="body">1) Explore Biomes</text>
  <text x="78" y="246" class="small">- Scrap Dunes</text>
  <text x="78" y="268" class="small">- Whispering Archives</text>
  <text x="78" y="290" class="small">- Plasma Crater</text>
  <text x="78" y="312" class="tiny">Seamless sector traversal (no stage breaks)</text>

  <rect x="336" y="196" width="240" height="130" class="chip"/>
  <text x="348" y="220" class="body">2) Scavenge Tech + Food</text>
  <text x="350" y="244" class="small">Human Scrap | Alien Crystals</text>
  <text x="350" y="266" class="small">Star-Melons | Glow-Berries</text>
  <text x="350" y="290" class="tiny">Drops feed crafting + survival economy</text>

  <rect x="64" y="338" width="250" height="138" class="chip"/>
