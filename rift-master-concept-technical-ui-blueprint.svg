  <rect x="140" y="374" width="130" height="14" rx="7" fill="#56ffd5"/>
  <text x="78" y="412" class="small">Hunger (Energy)</text>
  <rect x="200" y="400" width="90" height="14" rx="7" fill="#ff5895"/>
  <rect x="140" y="400" width="150" height="14" rx="7" fill="none" stroke="#ff7faf" stroke-width="1.2"/>
  <text x="78" y="440" class="danger">ZERO HUNGER =&gt; EXHAUSTED (slow movement)</text>

  <rect x="336" y="338" width="240" height="138" class="chip"/>
  <text x="348" y="362" class="body">4) Quantum Workbench</text>
  <text x="350" y="386" class="small">Scrap + Crystals =&gt; Tier Weapons</text>
  <text x="350" y="408" class="small">T1 Pulse Blade | T2 Arc Launcher</text>
  <text x="350" y="430" class="small">T3 Vex-Piercer Cannon</text>
  <text x="350" y="456" class="tiny">Crafting output directly modifies combat loadout</text>

