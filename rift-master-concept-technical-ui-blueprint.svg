<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080914"/>
      <stop offset="50%" stop-color="#161136"/>
      <stop offset="100%" stop-color="#100a24"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171d3f" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0f132b" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e8ff"/>
      <stop offset="100%" stop-color="#b14dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52f1ff"/>
    </marker>
    <style><![CDATA[
      .title { font: 700 48px 'Inter', Arial, sans-serif; fill: #e7f8ff; letter-spacing: 1px; }
      .subtitle { font: 600 20px 'Inter', Arial, sans-serif; fill: #87dfff; }
      .panel { fill: url(#panelGrad); stroke: #2cc7ff; stroke-width: 2; rx: 16; }
      .panel-title { font: 700 24px 'Inter', Arial, sans-serif; fill: #7fe9ff; }
      .body { font: 500 17px 'Inter', Arial, sans-serif; fill: #d7e7ff; }
      .small { font: 500 14px 'Inter', Arial, sans-serif; fill: #b9cbff; }
      .tiny { font: 600 12px 'Inter', Arial, sans-serif; fill: #d4f8ff; }
      .chip { fill: #19254f; stroke: #58d8ff; stroke-width: 1.2; rx: 8; }
      .danger { fill: #ff4d7c; font: 700 15px 'Inter', Arial, sans-serif; }
      .ok { fill: #66ffbe; font: 700 15px 'Inter', Arial, sans-serif; }
      .mutedline { stroke: #4064aa; stroke-width: 1; stroke-dasharray: 4 5; opacity: 0.7; }
      .flow { stroke: #5ce9ff; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .accent { stroke: url(#accentGrad); stroke-width: 3; fill: none; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#bgGrad)"/>
  <g opacity="0.22">
    <path d="M0 200 H1920 M0 400 H1920 M0 600 H1920 M0 800 H1920" class="mutedline"/>
    <path d="M240 0 V1080 M480 0 V1080 M720 0 V1080 M960 0 V1080 M1200 0 V1080 M1440 0 V1080 M1680 0 V1080" class="mutedline"/>
  </g>

  <text x="960" y="66" text-anchor="middle" class="title">RIFT: MASTER CONCEPT &amp; TECHNICAL UI BLUEPRINT</text>
  <text x="960" y="98" text-anchor="middle" class="subtitle">Open-World Survival | Android Multi-Touch Combat-Crafting | Companion Protocols | Mutation States</text>

