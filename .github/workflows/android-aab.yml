name: Android AAB CI

on:
  push:
    branches:
      - main
      - cursor/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_STATUS: "stable"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot headless + export templates
        run: |
          set -euxo pipefail
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${GODOT_FILE}.zip"
          curl -L "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/${GODOT_FILE}" /usr/local/bin/godot4

          TEMPLATE_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${TEMPLATE_FILE}"
          curl -L "$TEMPLATE_URL" -o /tmp/templates.tpz
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_TARGET"
          if [ -d /tmp/godot_templates/templates ]; then
            cp -R /tmp/godot_templates/templates/* "$TEMPLATE_TARGET/"
          else
            cp -R /tmp/godot_templates/* "$TEMPLATE_TARGET/"
          fi

      - name: Generate debug keystore for CI exports
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build AAB
        env:
          GODOT_BIN: godot4
          PRESET_NAME: "Android AAB"
          INSTALL_ANDROID_BUILD_TEMPLATE: "1"
          GODOT_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_PASSWORD: android
        run: |
          ./tools/build_apk.sh release aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rift-aab-release-${{ github.sha }}
          path: build/*.aab
          if-no-files-found: error
          retention-days: 14
