name: Android Play Store Publish

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: Release status
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
          - inProgress

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_STATUS: "stable"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repository release preflight checks
        run: |
          ./tools/preflight_release_check.sh

      - name: Validate required configuration
        run: |
          if [ -z "${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}" ]; then
            echo "Missing repository variable: GOOGLE_PLAY_PACKAGE_NAME"
            exit 1
          fi
          if [ -z "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "Missing secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_ALIAS }}" ] || [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "Missing Android keystore secrets."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Godot headless + export templates
        run: |
          set -euxo pipefail
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${GODOT_FILE}.zip"
          curl -L "$GODOT_URL" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          install -m 0755 "/tmp/godot/${GODOT_FILE}" /usr/local/bin/godot4

          TEMPLATE_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${TEMPLATE_FILE}"
          curl -L "$TEMPLATE_URL" -o /tmp/templates.tpz
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          TEMPLATE_TARGET="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_TARGET"
          if [ -d /tmp/godot_templates/templates ]; then
            cp -R /tmp/godot_templates/templates/* "$TEMPLATE_TARGET/"
          else
            cp -R /tmp/godot_templates/* "$TEMPLATE_TARGET/"
          fi

      - name: Decode release keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed AAB
        env:
          GODOT_BIN: godot4
          PRESET_NAME: "Android AAB"
          INSTALL_ANDROID_BUILD_TEMPLATE: "1"
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./tools/build_apk.sh release aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: rift-aab-play-upload-${{ github.sha }}
          path: build/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: build/rift-bestiary-protocol-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}
