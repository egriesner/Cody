<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090c1f"/>
      <stop offset="100%" stop-color="#1b1039"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12213f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c1630" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#b84dff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2d58" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ce9ff"/>
    </marker>
    <style>
      .title { font: 700 48px 'Arial', sans-serif; fill: #d7f8ff; letter-spacing: 1px; }
      .subtitle { font: 500 20px 'Arial', sans-serif; fill: #99ecff; }
      .panel { fill: url(#panel); stroke: #42dfff; stroke-width: 2; rx: 18; }
      .ph { font: 700 24px 'Arial', sans-serif; fill: #e6fbff; }
      .tx { font: 500 17px 'Arial', sans-serif; fill: #c8f5ff; }
      .small { font: 500 14px 'Arial', sans-serif; fill: #9de8f8; }
      .tag { font: 700 12px 'Arial', sans-serif; fill: #071326; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.55"/>

  <rect x="40" y="22" width="1840" height="82" fill="#111e3f" stroke="url(#accent)" stroke-width="2" rx="14"/>
