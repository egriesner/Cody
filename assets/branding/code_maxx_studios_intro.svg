<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a17"/>
      <stop offset="100%" stop-color="#120a26"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="46%">
      <stop offset="0%" stop-color="#22e3ff" stop-opacity="0.82"/>
      <stop offset="60%" stop-color="#8f4bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
